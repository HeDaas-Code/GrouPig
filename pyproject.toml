[project]
name = "grouppig"
version = "0.1.0"
description = "GrouPig —— 原子化 QQ AI 群友（依据 normify-grouppig 计划态设计落地）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "websockets>=12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
# 与 `python -m grouppig.runtime` 是同一个入口（runtime/app.py:main）。
grouppig = "grouppig.runtime.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grouppig"]

[tool.hatch.build.targets.wheel.force-include]
# 装到 site-packages 之后仓库走查必然失败，所以把设计树也随包带上一份。
# 仓库里那份**原地不动**：contract.api_index_path() 永远优先返回它，
# 计数类测试（test_contract_alignment / test_skeleton）看到的还是同一棵树。
#
# 注意：api-index.json 不在这里列 —— `src/grouppig/_data/api-index.json` 已经是一份
# 物理副本，packages 会自动带上；再 force-include 一次 hatchling 会因「同一路径写两次」直接构建失败。
"normify-grouppig/modules" = "grouppig/_data/modules"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
