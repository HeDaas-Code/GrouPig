# GrouPig 开发期配置（SQLite + 本机 NapCat）
# 生产/私有覆盖请另建 config/grouppig.local.toml（已 gitignore），或用 GROUPPIG__A__B 环境变量覆盖。
# 密钥绝不写在本文件：走 GROUPPIG_MODEL_API_KEY 环境变量或 ~/.dsh/.credentials.yaml。

[app]
name = "grouppig"
env = "dev"

[logging]
level = "INFO"
json = true
file = ""

[storage]
# sqlite（开发） | mysql（生产）。dsn 前缀必须与 driver 一致。
driver = "sqlite"
dsn = "sqlite+aiosqlite:///./var/grouppig.db"

[onebot]
# NapCat 的 OneBot v11 正向 WebSocket 地址
ws_url = "ws://127.0.0.1:3001"
access_token = ""
self_id = 0
reconnect_interval = 3.0
heartbeat_interval = 30.0

[perception.interrupt]
# 无 @ 时把不可用的 mentioned 权重归一给其余有效分量。
renormalize = true
# A3 跨群实测：0.26 是四群都能开口且未退化成每轮开口的最高稳定点。
threshold = 0.26
# 提问密度折让：窗口里提问占比达到 question_ratio_min 时阈值下调 question_discount。
# question_ratio 一直由特征编码器算出来（逐条 is_question），此前没有任何消费方 ——
# 满屏「这怎么弄？」的群和满屏闲聊的群拿到同一个阈值。与「被点名折让」同一机制：
# 降门槛而不是加分，所以非提问窗口的分数逐位不变。
question_ratio_min = 0.34
question_discount = 0.08

[perception.classify]
# 滞回保质期（秒）：在任行为保持超过这么久后，滞回不再阻拦切换。
# 滞回只防抖动，不该把状态冻结 —— 没有它，一个高置信度的 flooding（0.875）
# 永远无法被顶掉，而 flooding 会让插话评分直接 hold，等于把这个群永久静音。
sticky_ttl = 180.0

[model]
default_provider = "a6api"
# 是否让 httpx 读取环境代理变量（HTTP_PROXY / HTTPS_PROXY / ALL_PROXY / NO_PROXY）。
# 默认 false：模型服务商是公网 HTTPS 端点，被宿主代理静默劫持只会表现为「超时 / 502」，
# 配置里看不出异常；而且不合法的 NO_PROXY 条目（例如 [::1]）会让 httpx 在构造客户端时
# 直接抛 InvalidURL，所有模型调用在发出请求前就失败。需要走代理的部署显式设 true。
trust_env = false

[model.providers.a6api]
# 按实际服务商填写，例如 "https://<host>/v1"；留空时 http transport 启动会告警。
base_url = "https://api.a6api.com/v1"
api_key_env = "GROUPPIG_MODEL_API_KEY"
api_key_field = "model.api_key"

[model.providers.local]
# 本地确定性嵌入：无网络、无密钥、无额外依赖（见 src/grouppig/infra/runtime/local_embed.py）
base_url = "local"

[model.providers.laya]
# LAY A System-1 决策模型：非 OpenAI 兼容，唯一端点 POST {base_url}/v1/systemone。
# 密钥不入仓库，解析顺序：GROUPPIG_LAYA_API_KEY → GROUPPIG_MODEL_API_KEY
# → 凭据 model.api_key / refs.model.api_key（详见 infra/runtime/transport.resolve_api_key）。
# 本机部署：服务实测只监听 127.0.0.1:7780，所以这里填回环地址（填局域网 IP 会连不上）。
# 代价：tests/test_laya_e2e.py 的离线保证退化为「改写前后逐字相等」，由
# test_repo_config_endpoints_are_the_declared_ones 守住「常量与配置一致」来兜底。
base_url = "http://127.0.0.1:7780"
api_key_env = "GROUPPIG_LAYA_API_KEY"
api_key_field = "model.api_key"

[model.providers.deepseek]
base_url = ""
api_key_env = "DEEPSEEK_API_KEY"
api_key_field = "model.api_key"

[model.tasks.chat]
provider = "a6api"
model = "grok-4.6"
temperature = 0.8
max_tokens = 512
fallback_models = ["deepseek-v4-flash"]

[model.tasks.classify]
# 默认走 LAY A System-1（model 是协议枚举，不是服务商模型名）；grok-4.6 保留为降级目标。
provider = "laya"
model = "auto"
temperature = 0.0
max_tokens = 64
fallback_models = ["grok-4.6"]

[model.tasks.embed]
provider = "local"
model = "local-ngram-64"
temperature = 0.0
max_tokens = 0
fallback_models = []

[model.retry]
max_attempts = 3
base_delay = 0.5
max_delay = 8.0
multiplier = 2.0
jitter = 0.1
timeout = 30.0

[token]
# 每日 token 上限（0 表示不限）
daily_limit = 0
default_scenario = "chat"

# 预算策略：闲聊低配、讨论高配（对应设计 grouppig.infra.token-budget.policy）
[token.policies.smalltalk]
max_input_tokens = 800
max_output_tokens = 120
on_exceed = "clamp"

[token.policies.chat]
max_input_tokens = 1600
max_output_tokens = 320
on_exceed = "clamp"

[token.policies.discussion]
max_input_tokens = 4000
max_output_tokens = 800
on_exceed = "clamp"

[token.policies.reflection]
max_input_tokens = 8000
max_output_tokens = 1500
on_exceed = "clamp"

[token.policies.classify]
max_input_tokens = 2000
max_output_tokens = 64
on_exceed = "clamp"

[token.policies.embed]
max_input_tokens = 4000
max_output_tokens = 0
on_exceed = "clamp"

[bus]
# 主题名只允许出现在 normify-grouppig/api-index.json 的 kafka: 集合中
strict_topics = true
handler_timeout = 5.0

[app.integration]
# 周期泵的节拍与保留策略。留空即用代码默认值；非法值会在启动前被校验器拦下
# （见 infra/config/validator.py —— 容错读取会把「配错了」和「没配」变成同一件事）。
#
# 保留策略（maintenance.retention）：三个清理接口在设计树里都注册了处理器，
# 却没有任何生产调用方。没有这个泵，chat_window_index 只增不减、黑话库只读不衰、
# 关系分永不衰减 —— 跑得越久，库越大，「最近」这个语义越不存在。
maintenance = true
maintenance_interval = 3600.0   # 秒；清理是慢活，不必勤跑
retention_limit = 300           # 单轮衰减处理的词条 / 关系边上限
# retention_keep_seconds = 7200.0  # 过期窗口保留时长（秒）；注释掉 = 用记忆层默认值
#
# 静默唤醒（perception.idle_speak）：插话评分在设计树里只有 behavior.changed 一条入边，
# 而行为分类器带滞回 —— 一场连贯的群聊里行为往往从头不变，于是每个群一辈子只被打一次分，
# 冷却过后再无第二次触发源。这个泵按「群静下来了」补触发：窗口里还有近期消息（是活群），
# 但已经安静够久。它只负责**敲门**，该不该开口仍由 rpc:interrupt.score → decide 全权决定。
idle_speak = true
idle_interval = 60.0        # 秒；巡检节拍
idle_seconds = 150.0        # 群安静超过这么久才算「静下来了」
idle_max_seconds = 1800.0   # 安静超过这么久就不再唤醒（别对着几小时前的旧话题诈尸）
idle_min_messages = 2       # 窗口里至少这么多条才算活群
idle_limit = 20             # 单轮最多评分几个群（按静默时长升序）
